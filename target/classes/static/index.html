<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftHire</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #07111f;
            color: #edf4ff;
            font-family: "Segoe UI", sans-serif;
            padding: 24px;
        }

        .card {
            max-width: 720px;
            width: 100%;
            padding: 32px;
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(15, 29, 53, 0.95), rgba(8, 16, 30, 0.98));
            border: 1px solid rgba(148, 177, 214, 0.16);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            margin: 0 0 12px;
            line-height: 1.6;
            color: #95a9c7;
        }

        code {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(78, 161, 255, 0.12);
            border: 1px solid rgba(78, 161, 255, 0.24);
            color: #cfe4ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>SwiftHire frontend build required</h1>
        <p>
            The React app is served from <strong>frontend/dist</strong> when you build the frontend.
            Run the frontend build, then refresh this page.
        </p>
        <p>Frontend dev server:</p>
        <code>cd frontend && npm install && npm run dev</code>
    </div>
</body>
</html>
